plugins { id 'com.android.application' }

/* 웹 파일은 저장소 루트에 있는 것 하나가 원본이다.
   android/ 안에 복사본을 두면 사본이 둘이 되어 반드시 어긋난다 —
   웹에서 고친 것이 APK 에 안 들어가거나 그 반대가 된다.
   빌드할 때마다 루트에서 가져와 assets 로 넣는다. */
def webAssets = layout.buildDirectory.dir('generated/web')

tasks.register('syncWebAssets', Sync) {
  description = '저장소 루트의 정적 파일을 APK 의 assets 로 복사한다'
  from(rootProject.file('..')) {
    include 'index.html', 'sw.js', 'manifest.webmanifest'
    include 'css/**', 'js/**', 'assets/**'
  }
  into webAssets
}
tasks.named('preBuild') { dependsOn 'syncWebAssets' }

android {
  namespace 'com.ajsbit.assetcompass'
  compileSdk 35

  defaultConfig {
    applicationId "com.ajsbit.assetcompass"
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName "1.0"
  }

  sourceSets {
    main { assets.srcDirs += webAssets }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug   // 사이드로드용. 스토어 배포 시 별도 키로 교체
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // 전이 의존성이 kotlin-stdlib 1.8.22 와 kotlin-stdlib-jdk8 1.6.21 을 같이 끌어와
  // 클래스가 중복된다. BOM 으로 버전을 맞추면 jdk8 쪽이 빈 껍데기가 되어 사라진다.
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.webkit:webkit:1.12.1'
}
