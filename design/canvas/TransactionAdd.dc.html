<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3556E6; text-decoration: none; }
    a:hover { color: #2743C4; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #2A3245; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; font-variant-numeric: tabular-nums;">

  <div style="height: 60px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; flex-shrink: 0;">
    <span style="font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,.62);">배경을 눌러 닫기</span>
  </div>

  <div style="flex: 1; min-height: 0; background: #FFFFFF; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; overflow: hidden; color: #101828;">

    <div style="display: flex; justify-content: center; padding: 9px 0 0; flex-shrink: 0;">
      <span style="width: 38px; height: 4px; border-radius: 99px; background: #D7DEEA;"></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px 13px; border-bottom: 1px solid #EFF2F8; flex-shrink: 0;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.025em; color: #101828;">거래 추가</h2>
      <div style="width: 36px; height: 36px; border-radius: 11px; background: #F4F6FB; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 18px 0; display: flex; flex-direction: column; gap: 15px;">

      <div>
        <div style="font-size: 12px; font-weight: 600; color: #475467; margin-bottom: 7px;">거래 종류</div>
        <div style="display: flex; gap: 4px; background: #F4F6FB; border-radius: 11px; padding: 3px;">
          <div style="flex: 1; height: 36px; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #101828; box-shadow: 0 1px 2px rgba(16,24,40,.08);">일반 소비</div>
          <div style="flex: 1; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #5B6880;">저축·투자</div>
          <div style="flex: 1; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #5B6880;">대출상환</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <div style="font-size: 12px; font-weight: 600; color: #475467; margin-bottom: 7px;">날짜</div>
          <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 11px; border: 1px solid #CFD7E6; background: #FFFFFF;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#626D88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span style="font-size: 15px; font-weight: 500; color: #101828;">2026. 09. 08</span>
          </div>
        </div>
        <div style="width: 148px;">
          <div style="font-size: 12px; font-weight: 600; color: #475467; margin-bottom: 7px;">금액 <span style="color: #C0342F;">*</span></div>
          <div style="display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 12px; border-radius: 11px; border: 1.5px solid #3556E6; background: #FFFFFF;">
            <span style="flex: 1; text-align: right; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: #101828;">32,000</span>
            <span style="font-size: 13px; font-weight: 500; color: #626D88;">원</span>
          </div>
        </div>
      </div>

      <div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;">
          <span style="font-size: 12px; font-weight: 600; color: #475467;">카테고리 <span style="color: #C0342F;">*</span></span>
          <span style="font-size: 11.5px; color: #626D88;">13개 중 선택</span>
        </div>
        <div style="display: flex; gap: 7px; overflow: hidden;">
          <div style="display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 13px; border-radius: 99px; background: #f97316; color: #FFFFFF; font-size: 13px; font-weight: 600; flex-shrink: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7.5 2v20"/><path d="M19.5 2c-1.7 1-3 3.5-3 6.5 0 2 1 3.5 3 3.5v10"/></svg>
            식비
          </div>
          <div style="display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 13px; border-radius: 99px; background: #FFFFFF; border: 1px solid #E3E8F1; color: #475467; font-size: 13px; font-weight: 500; flex-shrink: 0;">
            <span style="width: 8px; height: 8px; border-radius: 3px; background: #d97706;"></span>
            카페/간식
          </div>
          <div style="display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 13px; border-radius: 99px; background: #FFFFFF; border: 1px solid #E3E8F1; color: #475467; font-size: 13px; font-weight: 500; flex-shrink: 0;">
            <span style="width: 8px; height: 8px; border-radius: 3px; background: #0ea5e9;"></span>
            교통
          </div>
          <div style="display: inline-flex; align-items: center; height: 38px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; border: 1px solid #E3E8F1; color: #626D88; font-size: 13px; font-weight: 500; flex-shrink: 0;">더보기</div>
        </div>
      </div>

      <div>
        <div style="font-size: 12px; font-weight: 600; color: #475467; margin-bottom: 7px;">메모 <span style="font-weight: 500; color: #697182;">선택</span></div>
        <div style="display: flex; align-items: center; height: 46px; padding: 0 12px; border-radius: 11px; border: 1px solid #CFD7E6; background: #FFFFFF;">
          <span style="font-size: 15px; font-weight: 400; color: #101828;">점심 · 팀 회식</span>
        </div>
      </div>

      <div style="background: #F4F6FB; border-radius: 14px; padding: 13px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="min-width: 0;">
            <div style="font-size: 13.5px; font-weight: 600; color: #101828;">잔액에도 반영하기</div>
            <div style="font-size: 11.5px; color: #626D88; margin-top: 2px;">선택한 계좌의 잔액이 함께 줄어들어요</div>
          </div>
          <div style="width: 46px; height: 27px; border-radius: 99px; background: #3556E6; padding: 3px; display: flex; justify-content: flex-end; flex-shrink: 0;">
            <span style="width: 21px; height: 21px; border-radius: 99px; background: #FFFFFF;"></span>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; margin-top: 10px; padding: 0 12px; border-radius: 11px; border: 1px solid #CFD7E6; background: #FFFFFF;">
          <span style="font-size: 14px; font-weight: 500; color: #101828;">생활비 통장</span>
          <div style="display: flex; align-items: center; gap: 7px;">
            <span style="font-size: 12px; color: #626D88;">잔액 412만원</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#697182" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 7px; padding: 0 2px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#626D88" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span style="font-size: 11.5px; line-height: 1.45; color: #626D88;">일반 소비는 월급 대비 소비율과 카테고리 한도에 함께 반영됩니다. 저축·투자 이체와 대출상환은 소비율에서 제외돼요.</span>
      </div>

    </div>

    <div style="display: flex; gap: 10px; padding: 12px 18px 20px; border-top: 1px solid #EFF2F8; flex-shrink: 0;">
      <div style="flex: 1; height: 48px; border-radius: 13px; border: 1px solid #D7DEEA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #475467;">취소</div>
      <div style="flex: 1.4; height: 48px; border-radius: 13px; background: #3556E6; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #FFFFFF;">거래 저장</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
