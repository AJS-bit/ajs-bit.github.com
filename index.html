<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="description" content="순자산 대비 소비율을 메인 지표로 삼는 재산 증가 내비게이션. 가계부를 넘어 저축·투자·부채상환까지 한 번에.">
<title>자산 나침반 · 재산 증가 내비게이션</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.6 8.4 13.4 13.4 8.4 15.6 10.6 10.6z" fill="currentColor"/></svg>
      </span>
      <span>
        <strong>자산 나침반</strong>
        <small>재산 증가 내비게이션</small>
      </span>
    </div>
    <div class="topbar__actions">
      <button class="iconbtn iconbtn--bell" data-act="notifications" title="알림" aria-label="알림">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M18 15.5V10a6 6 0 1 0-12 0v5.5L4.5 18h15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0" stroke-linecap="round"/>
        </svg>
        <span class="badge" id="bell-badge" hidden></span>
      </button>
      <button class="iconbtn" data-act="settings" title="설정" aria-label="설정">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.1 14.4a1.5 1.5 0 0 0 .3 1.65l.05.06a1.8 1.8 0 1 1-2.55 2.55l-.06-.06a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.9 1.37v.16a1.8 1.8 0 1 1-3.6 0v-.09a1.5 1.5 0 0 0-.98-1.37 1.5 1.5 0 0 0-1.65.3l-.06.06a1.8 1.8 0 1 1-2.55-2.55l.05-.06a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.37-.9h-.16a1.8 1.8 0 1 1 0-3.6h.09a1.5 1.5 0 0 0 1.37-.98 1.5 1.5 0 0 0-.3-1.65l-.05-.06a1.8 1.8 0 1 1 2.55-2.55l.06.05a1.5 1.5 0 0 0 1.65.3h.07a1.5 1.5 0 0 0 .9-1.37v-.16a1.8 1.8 0 1 1 3.6 0v.09a1.5 1.5 0 0 0 .9 1.37 1.5 1.5 0 0 0 1.65-.3l.06-.05a1.8 1.8 0 1 1 2.55 2.55l-.05.06a1.5 1.5 0 0 0-.3 1.65v.07a1.5 1.5 0 0 0 1.37.9h.16a1.8 1.8 0 1 1 0 3.6h-.09a1.5 1.5 0 0 0-1.37.9z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>

  <main class="main" id="main" tabindex="-1"></main>

</div>

<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<!-- 이 앱의 js/ 는 ES2020(옵셔널 체이닝 ?. · 널 병합 ??)을 쓴다. 지원하지 않는
     브라우저에서는 모듈이 **파싱 단계에서** 죽어 아무 코드도 실행되지 않고, 상단바만
     남은 빈 화면이 된다. 안드로이드 WebView 66(Chrome 66)에서 실제로 그랬다.
     type="module" 자체는 Chrome 61부터 인식하므로 nomodule 대체는 걸리지 않는다.
     그래서 문법 지원 여부를 고전 스크립트로 직접 재고, 안 되면 이유를 말해준다. -->
<script>
(function () {
  try { new Function('var o={a:{b:1}};return o?.a?.b ?? 0;')(); return; } catch (e) {}
  var show = function () {
    var m = document.getElementById('main');
    if (!m) return;
    m.innerHTML =
      '<section class="card" style="text-align:center;padding:26px 18px">' +
      '<div style="font-size:34px;margin-bottom:10px">🧭</div>' +
      '<h2 style="font-size:17px;margin-bottom:8px">브라우저가 오래되었습니다</h2>' +
      '<p class="hint" style="max-width:340px;margin:0 auto">' +
      '이 앱은 2020년 이후 브라우저 기능을 씁니다. ' +
      '안드로이드에서는 Play 스토어에서 <b>Android System WebView</b> 와 <b>Chrome</b> 을 ' +
      '업데이트하면 바로 동작합니다.</p></section>';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
