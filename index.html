<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="description" content="순자산 대비 소비율을 메인 지표로 삼는 재산 증가 내비게이션. 가계부를 넘어 저축·투자·부채상환까지 한 번에.">
<title>자산 나침반 · 재산 증가 내비게이션</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.6 8.4 13.4 13.4 8.4 15.6 10.6 10.6z" fill="currentColor"/></svg>
      </span>
      <span>
        <strong>자산 나침반</strong>
        <small>재산 증가 내비게이션</small>
      </span>
    </div>
    <div class="topbar__actions">
      <button class="iconbtn" data-act="theme" title="테마 전환" aria-label="테마 전환">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <button class="iconbtn" data-act="settings" title="설정" aria-label="설정">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>

  <main class="main" id="main" tabindex="-1"></main>

</div>

<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
